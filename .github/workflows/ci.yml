name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run: adds the checks that download the published model (no token needed).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests with coverage (unit and integration with mocks; no download, no GPU)
        run: pytest --cov --cov-report=term

      - name: API coverage of at least 90%
        run: coverage report --include="src/ncm_classifier/api/*" --fail-under=90

  release-checks:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: API with the published model (Hugging Face Hub, v0.1.0)
        env:
          NCM_RUN_HUB_TESTS: "1"
        run: pytest -m hub

      - name: Build the API image
        run: docker build -t ncm-classifier-api .

      - name: Run the image and call the API
        run: |
          docker run -d --name api -p 7860:7860 ncm-classifier-api
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:7860/health && break
            sleep 2
          done
          curl -sf http://localhost:7860/health
          curl -sf -X POST http://localhost:7860/v1/predictions \
            -H "Content-Type: application/json" \
            -d '{"description": "Ureia agrícola, pacote 1 kg"}' | grep -q '"ncm":"3105"'
          test "$(docker exec api id -u)" = "1000"
          docker rm -f api
