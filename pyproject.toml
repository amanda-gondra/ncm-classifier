[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-classifier"
version = "0.1.0"
description = "Suggests NCM codes from commercial product descriptions (Brazilian agribusiness)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amanda Gondra" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scikit-learn>=1.5,<2",
    "joblib>=1.3",
    "scipy>=1.11",
    "skops>=0.11",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # The API downloads the published model at a fixed revision.
    "huggingface_hub>=0.34",
]

[project.optional-dependencies]
# Heavy training stack: installed in Colab/Kaggle, not needed to run the API with the baseline.
train = [
    "torch>=2.3",
    "transformers>=4.44,<6",
    "datasets>=2.20",
    "accelerate>=0.33",
]
# Model comparison and inference benchmark (scripts/compare_models.py, benchmark_inference.py).
analysis = [
    "matplotlib>=3.8",
    "psutil>=5.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    # Keeps notebooks/*.ipynb generated from their reviewable notebooks/*.py source.
    "jupytext>=1.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Official descriptions of the classified positions, read by the API.
"ncm_classifier.data" = ["positions.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "hub: downloads the published model from the Hugging Face Hub (set NCM_RUN_HUB_TESTS=1)",
]

[tool.coverage.run]
source = ["ncm_classifier"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ncm_classifier/api", "src/ncm_classifier/inference", "src/ncm_classifier/data/positions.py"]
# Third-party libraries without type information.
[[tool.mypy.overrides]]
module = ["sklearn.*", "skops.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Generated by jupytext from notebooks/*.py, which is the linted source.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Notebook cells import where they are used (E402), show their last expression as output (B018),
# check the Python of the remote kernel (UP036) and run git with fixed arguments (S603, S607).
"notebooks/*.py" = ["E402", "B018", "UP036", "S603", "S607"]
